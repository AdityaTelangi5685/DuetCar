
name: Build Duet Drive APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Find project folder
        id: project
        shell: bash
        run: |
          PACKAGE=$(find . -type f -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/android/*' \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "package.json not found"
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

          DIR=$(dirname "$PACKAGE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install

      - name: Set up Android project
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run setup

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: duet-drive-debug-apk
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
