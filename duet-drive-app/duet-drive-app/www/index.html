<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<title>Duet Drive</title>
<style>
@font-face{font-family:"Bungee";src:url(fonts/bungee-400.woff2) format("woff2");font-weight:400;font-display:swap;}
@font-face{font-family:"Chakra Petch";src:url(fonts/chakra-petch-500.woff2) format("woff2");font-weight:500;font-display:swap;}
@font-face{font-family:"Chakra Petch";src:url(fonts/chakra-petch-600.woff2) format("woff2");font-weight:600;font-display:swap;}
@font-face{font-family:"Chakra Petch";src:url(fonts/chakra-petch-700.woff2) format("woff2");font-weight:700;font-display:swap;}
/* Layout: one full-screen canvas road; HUD floats on top; start / game-over cards centered over the road. Single deliberate night look. */
:root{
  --night:#0d1017;
  --asphalt:#171b24;
  --asphalt-2:#1d2230;
  --paint:#e9e4d8;
  --amber:#ffb13b;
  --blue:#4aa8ff;
  --muted:#8b93a7;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{background:var(--night);color:var(--paint);font-family:var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#stage{position:relative;height:100%;width:100%;touch-action:none;}
canvas{display:block;width:100%;height:100%;}
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.hud .score{font-family:var(--display);font-size:clamp(34px,9vw,52px);line-height:1;letter-spacing:.02em;
  position:absolute;left:50%;transform:translateX(-50%);text-shadow:0 2px 0 rgba(0,0,0,.5);font-variant-numeric:tabular-nums;}
.hud .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;
  font-variant-numeric:tabular-nums;}
.hud .tag b{display:block;color:var(--paint);font-size:16px;letter-spacing:.04em;}
.hud .right{text-align:right;}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(13,16,23,.55);}
.card{width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,58px);line-height:.95;margin:0;text-wrap:balance;}
.card h1 .a{color:var(--amber);} .card h1 .b{color:var(--blue);}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.45;}
.howto{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;}
.howto div{border:1px solid rgba(233,228,216,.14);border-radius:10px;padding:10px 8px;font-size:13px;line-height:1.35;color:var(--paint);}
.howto .l{border-color:rgba(255,177,59,.5);} .howto .r{border-color:rgba(74,168,255,.5);}
.howto span{display:block;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-bottom:3px;}
.howto .l span{color:var(--amber);} .howto .r span{color:var(--blue);}
.btn{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--night);background:var(--paint);
  border:0;border-radius:999px;padding:14px 34px;cursor:pointer;}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px;}
.big{font-family:var(--display);font-size:72px;line-height:1;font-variant-numeric:tabular-nums;}
.small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.keys{font-size:12px;color:var(--muted);}
</style>
</head>
<body>

<div id="stage">
  <canvas id="c"></canvas>
  <div class="hud" id="hud">
    <div class="tag">Speed<b id="spd">1.0×</b></div>
    <div class="score" id="score">0</div>
    <div class="tag right">Best<b id="best">0</b></div>
  </div>

  <div class="overlay" id="start">
    <div class="card">
      <h1><span class="a">Duet</span><br><span class="b">Drive</span></h1>
      <p>Two cars, four lanes, one brain. Dodge every block. The road keeps getting faster.</p>
      <div class="howto">
        <div class="l"><span>Left half</span>Tap to switch the amber car</div>
        <div class="r"><span>Right half</span>Tap to switch the blue car</div>
      </div>
      <button class="btn" id="play">Start</button>
      <div class="keys">Keyboard: A / ← for amber, D / → for blue</div>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="card">
      <div class="small">Paused</div>
      <button class="btn" id="resume">Resume</button>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="card">
      <div class="small">Crashed</div>
      <div class="big" id="final">0</div>
      <p id="overMsg">blocks dodged</p>
      <button class="btn" id="again">Drive again</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), spdEl = $('spd');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const COL = { amber:'#ffb13b', blue:'#4aa8ff', asphalt:'#171b24', asphalt2:'#1d2230', paint:'#e9e4d8', night:'#0d1017' };

  let best = 0;
  try { best = parseInt(localStorage.getItem('duetdrive-best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // ---------- geometry ----------
  let W = 0, H = 0, dpr = 1, G = {};
  function layout() {
    const oldH = H;
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height; dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const RW = Math.min(W, H * 0.62, 520);
    const laneW = RW / 4;
    const carW = laneW * 0.52, carH = carW * 1.7;
    G = {
      RW, laneW, roadX: (W - RW) / 2,
      carW, carH, carY: H - carH - Math.max(40, H * 0.13),
      obs: laneW * 0.5,
      base: Math.max(260, H * 0.42)
    };
    if (oldH && state) {
      const k = H / oldH;
      obstacles.forEach(o => o.y *= k);
      cars.forEach(c => c.x = laneX(c.lane));
    }
  }
  const laneX = i => G.roadX + G.laneW * (i + 0.5);

  // ---------- state ----------
  let state = 'ready';           // ready | playing | over
  let cars, obstacles, particles, elapsed, dist, score, speedMul, nextSpawn, shake, stripeOff, flash;

  function reset() {
    cars = [
      { lane: 0, side: 0, color: COL.amber, x: 0, tilt: 0 },
      { lane: 3, side: 1, color: COL.blue,  x: 0, tilt: 0 }
    ];
    cars.forEach(c => c.x = laneX(c.lane));
    obstacles = []; particles = [];
    elapsed = 0; dist = 0; score = 0; speedMul = 1; shake = 0; stripeOff = 0; flash = 0;
    nextSpawn = [G.obs * 6, G.obs * 9];
    scoreEl.textContent = '0'; spdEl.textContent = '1.0×';
  }

  function speed() { return G.base * speedMul; }

  // Minimum distance between two blocks on the same side, so a lane switch is always possible.
  function gapFor() {
    const s = speed();
    const min = G.obs + G.carH + s * 0.24 + G.laneW * 0.25;
    const extra = Math.max(G.obs * 1.5, H * 0.42 - (speedMul - 1) * H * 0.1);
    return min + Math.random() * extra;
  }

  function steer(side) {
    if (state !== 'playing') return;
    const c = cars[side];
    c.lane = side === 0 ? (c.lane === 0 ? 1 : 0) : (c.lane === 2 ? 3 : 2);
  }

  // ---------- input ----------
  const stage = $('stage');
  stage.addEventListener('pointerdown', e => {
    if (state !== 'playing') return;
    e.preventDefault();
    steer(e.clientX < W / 2 ? 0 : 1);
  });
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (state === 'playing') {
      if (k === 'a' || k === 'arrowleft') { steer(0); e.preventDefault(); }
      if (k === 'd' || k === 'l' || k === 'arrowright') { steer(1); e.preventDefault(); }
    } else if ((k === ' ' || k === 'enter') && document.activeElement?.tagName !== 'BUTTON') {
      if (state === 'paused') { state = 'playing'; $('paused').hidden = true; } else begin();
    }
  });
  $('play').addEventListener('click', begin);
  $('again').addEventListener('click', begin);
  $('resume').addEventListener('click', () => { state = 'playing'; $('paused').hidden = true; });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') { state = 'paused'; $('paused').hidden = false; }
  });

  function begin() {
    reset();
    state = 'playing';
    $('start').hidden = true; $('over').hidden = true;
  }

  function crash(car) {
    state = 'over';
    shake = reduceMotion ? 0 : 14; flash = 1;
    for (let i = 0; i < 28; i++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 320;
      particles.push({ x: car.x, y: G.carY + G.carH / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 0.6 + Math.random() * 0.5, t: 0, color: Math.random() < .5 ? car.color : COL.paint, s: 2 + Math.random() * 4 });
    }
    if (score > best) { best = score; try { localStorage.setItem('duetdrive-best', best); } catch (e) {} }
    bestEl.textContent = best;
    $('final').textContent = score;
    $('overMsg').textContent = score >= best && score > 0 ? 'blocks dodged · new best' : 'blocks dodged · best ' + best;
    setTimeout(() => { if (state === 'over') { $('over').hidden = false; $('again').focus({ preventScroll: true }); } }, 650);
  }

  // ---------- update ----------
  function update(dt) {
    if (state === 'playing') {
      elapsed += dt;
      speedMul = Math.min(3, 1 + elapsed / 40);           // +1x every 40 seconds, cap 3x
      const s = speed();
      dist += s * dt; stripeOff = (stripeOff + s * dt) % (G.laneW * 1.6);

      for (let side = 0; side < 2; side++) {
        if (dist >= nextSpawn[side]) {
          const lane = side * 2 + (Math.random() < .5 ? 0 : 1);
          obstacles.push({ lane, y: -G.obs, passed: false, rot: (Math.random() - .5) * .25 });
          nextSpawn[side] = dist + gapFor();
        }
      }

      for (const o of obstacles) {
        o.y += s * dt;
        if (!o.passed && o.y > G.carY + G.carH) { o.passed = true; score++; scoreEl.textContent = score; }
      }
      obstacles = obstacles.filter(o => o.y < H + G.obs * 2);

      for (const c of cars) {
        const tx = laneX(c.lane), dx = tx - c.x;
        c.x += dx * Math.min(1, dt * 20);
        c.tilt = Math.max(-.35, Math.min(.35, dx / G.laneW * .7));
      }

      // collision (slightly forgiving hitboxes)
      const cw = G.carW * .82, ch = G.carH * .86, cy = G.carY + G.carH * .07;
      for (const o of obstacles) {
        const ox = laneX(o.lane) - G.obs / 2, os = G.obs * .9;
        for (const c of cars) {
          const cx = c.x - cw / 2;
          if (cx < ox + os && cx + cw > ox && cy < o.y + os && cy + ch > o.y) { crash(c); break; }
        }
        if (state !== 'playing') break;
      }
      spdEl.textContent = speedMul.toFixed(1) + '×';
    } else if (state !== 'paused') {
      // idle drift on the start screen
      stripeOff = (stripeOff + G.base * .35 * dt) % (G.laneW * 1.6);
      if (cars) for (const c of cars) c.tilt *= .9;
    }

    for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; }
    particles = particles.filter(p => p.t < p.life);
    shake *= Math.pow(.02, dt); flash = Math.max(0, flash - dt * 2.5);
  }

  // ---------- draw ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawRoad() {
    ctx.fillStyle = COL.night; ctx.fillRect(0, 0, W, H);
    const { roadX, RW, laneW } = G;
    // two carriageways, slightly different tone per side
    ctx.fillStyle = COL.asphalt;  ctx.fillRect(roadX, 0, RW / 2, H);
    ctx.fillStyle = COL.asphalt2; ctx.fillRect(roadX + RW / 2, 0, RW / 2, H);
    // side tints
    let g = ctx.createLinearGradient(0, H, 0, 0);
    g.addColorStop(0, 'rgba(255,177,59,.07)'); g.addColorStop(1, 'rgba(255,177,59,0)');
    ctx.fillStyle = g; ctx.fillRect(roadX, 0, RW / 2, H);
    g = ctx.createLinearGradient(0, H, 0, 0);
    g.addColorStop(0, 'rgba(74,168,255,.07)'); g.addColorStop(1, 'rgba(74,168,255,0)');
    ctx.fillStyle = g; ctx.fillRect(roadX + RW / 2, 0, RW / 2, H);
    // edges
    ctx.fillStyle = COL.paint; ctx.globalAlpha = .85;
    ctx.fillRect(roadX, 0, 3, H); ctx.fillRect(roadX + RW - 3, 0, 3, H);
    // center double line
    ctx.fillStyle = COL.amber; ctx.globalAlpha = .9;
    ctx.fillRect(roadX + RW / 2 - 5, 0, 3, H); ctx.fillRect(roadX + RW / 2 + 2, 0, 3, H);
    // dashed lane lines
    ctx.fillStyle = COL.paint; ctx.globalAlpha = .45;
    const dash = laneW * .8, period = laneW * 1.6;
    for (const li of [1, 3]) {
      const x = roadX + laneW * li - 1.5;
      for (let y = -period + stripeOff; y < H; y += period) ctx.fillRect(x, y, 3, dash);
    }
    ctx.globalAlpha = 1;
  }

  function drawCar(c) {
    const w = G.carW, h = G.carH;
    ctx.save();
    ctx.translate(c.x, G.carY + h / 2);
    ctx.rotate(c.tilt);
    // headlight beams
    const beam = ctx.createLinearGradient(0, -h / 2, 0, -h / 2 - h * 1.6);
    beam.addColorStop(0, 'rgba(255,240,200,.22)'); beam.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = beam;
    ctx.beginPath(); ctx.moveTo(-w * .38, -h / 2); ctx.lineTo(-w * .9, -h / 2 - h * 1.6);
    ctx.lineTo(w * .9, -h / 2 - h * 1.6); ctx.lineTo(w * .38, -h / 2); ctx.closePath(); ctx.fill();
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(-w / 2 + 3, -h / 2 + 5, w, h, w * .28); ctx.fill();
    // body
    ctx.shadowColor = c.color; ctx.shadowBlur = 18;
    ctx.fillStyle = c.color; rr(-w / 2, -h / 2, w, h, w * .28); ctx.fill();
    ctx.shadowBlur = 0;
    // roof + windows
    ctx.fillStyle = 'rgba(13,16,23,.82)';
    rr(-w * .34, -h * .2, w * .68, h * .24, w * .1); ctx.fill();   // windshield
    rr(-w * .3, h * .16, w * .6, h * .14, w * .08); ctx.fill();     // rear glass
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    rr(-w * .3, -h * .02, w * .6, h * .16, w * .06); ctx.fill();    // roof sheen
    // headlights / taillights
    ctx.fillStyle = '#fff6dc';
    rr(-w * .42, -h * .48, w * .22, h * .06, 2); ctx.fill();
    rr(w * .2, -h * .48, w * .22, h * .06, 2); ctx.fill();
    ctx.fillStyle = '#ff4d4d';
    rr(-w * .42, h * .43, w * .2, h * .045, 2); ctx.fill();
    rr(w * .22, h * .43, w * .2, h * .045, 2); ctx.fill();
    ctx.restore();
  }

  function drawObstacle(o) {
    const s = G.obs, x = laneX(o.lane), y = o.y + s / 2;
    const color = o.lane < 2 ? COL.amber : COL.blue;
    ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot);
    ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(-s / 2 + 3, -s / 2 + 5, s, s, s * .14); ctx.fill();
    ctx.fillStyle = COL.paint; rr(-s / 2, -s / 2, s, s, s * .14); ctx.fill();
    // hazard stripes
    ctx.save(); rr(-s / 2 + s * .1, -s / 2 + s * .1, s * .8, s * .8, s * .08); ctx.clip();
    ctx.fillStyle = color;
    for (let k = -s; k < s; k += s * .28) {
      ctx.beginPath(); ctx.moveTo(k, -s / 2); ctx.lineTo(k + s * .14, -s / 2);
      ctx.lineTo(k + s * .14 + s, s / 2); ctx.lineTo(k + s, s / 2); ctx.closePath(); ctx.fill();
    }
    ctx.restore(); ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > .3) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawRoad();
    if (obstacles) obstacles.forEach(drawObstacle);
    if (cars) cars.forEach(drawCar);
    for (const p of particles) {
      ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = `rgba(255,90,70,${flash * .35})`; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > .05) dt = .05;          // tab switch / hitch guard
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', layout);
  layout(); reset();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
